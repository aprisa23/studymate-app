name: Build StudyMate Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Analyze, Test, and Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize root build.gradle.kts and settings.gradle.kts
        run: |
          cat << 'EOF' > android/build.gradle.kts
          plugins {
              id("com.android.application") version "9.1.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          EOF

          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val path = properties.getProperty("flutter.sdk")
                  require(path != null) { "flutter.sdk not set in local.properties" }
                  path
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
          }

          include(":app")
          EOF

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studymate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
